name: Sync to Hugging Face hub
on:
  push:
    branches: [telegram_bot]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # The robot needs to know who it is
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Action"
          
          # This is the magic line - replace exactly as shown
          git push --force https://Frey500:$HF_TOKEN@huggingface.co/spaces/Frey500/SELLICA telegram_bot:main