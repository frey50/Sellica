name: Sync to Hugging Face hub
on:
  push:
    branches: [telegram_bot]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # REPLACE YOUR_USERNAME and YOUR_SPACE_NAME below
          git push --force https://Frey_500:$HF_TOKEN@huggingface.co/spaces/Frey500/SELLICA telegram_bot:main